name: Meticulous Visual Regression Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  test:
    name: Run Meticulous Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.18.3'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (and all dependencies)
        run: pnpm --filter=n8n-editor-ui... build
        env:
          # Disable turbo cache to ensure fresh builds for comparison
          TURBO_FORCE: true

      - name: Verify build includes changes
        run: |
          echo "Checking if build includes visual changes..."
          if grep -r "ffebcd\|METICULOUS" packages/frontend/editor-ui/dist/assets/*.css 2>/dev/null; then
            echo "✅ Visual changes found in build"
          else
            echo "⚠️ Visual changes NOT found in build (might be in JS or not built)"
          fi

      - name: Run Meticulous tests and report diffs
        uses: alwaysmeticulous/report-diffs-action/upload-assets@v1
        with:
          api-token: ${{ secrets.METICULOUS_API_TOKEN }}
          app-directory: 'packages/frontend/editor-ui/dist'

